[project]
name = "bibliographycite"
version = "0.1.0"
description = "Конвертер бібліографічних записів з BibTeX у формат DSTU 8302:2015"
authors = [
    {name = "Vita"}
]
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}
keywords = ["bibtex", "dstu", "bibliography", "converter", "ukraine"]
dependencies = [
    "bibtexparser>=1.4.0",
]
[dependency-groups]
dev = [
    "pytest>=7.0.0",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bibliographycite"]